        // Randomize options for each question
        let questions = questionsData.map(q => {
            const optionsWithIndex = q.options.map((opt, idx) => ({
                text: opt,
                originalIndex: idx
            }));

            // Fisher-Yates shuffle
            for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
            }

            const newCorrectAnswerIndex = optionsWithIndex.findIndex(
                opt => opt.originalIndex === q.correctAnswer
            );

            return {
                ...q,
                options: optionsWithIndex. map(opt => opt.text),
                correctAnswer: newCorrectAnswerIndex
            };
        });

        let currentSlide = 0;
        let selectedAnswers = {};
        let answeredQuestions = 0;

        function initPresentation() {
            renderSlide(0);
            updateNavigation();
        }

        function renderSlide(index) {
            const questionSection = document.getElementById('questionSection');
            const summary = document.getElementById('summary');
            const slideCounter = document.getElementById('slideCounter');
            const progressFill = document.getElementById('progressFill');

            if (index === questions.length) {
                questionSection.style.display = 'none';
                summary.classList.add('show');
                calculateScore();
                return;
            }

            const question = questions[index];
            const isAnswered = index in selectedAnswers;

            questionSection.innerHTML = `
                <div class="slide slide-${index} active">
                    <div class="difficulty-badge difficulty-${question.difficulty. toLowerCase()}">
                        ${question.difficulty} • ${question.topic}
                    </div>
                    <div class="question-number">Question ${index + 1} of ${questions.length}</div>
                    <div class="question-text">${question.question}</div>
                    <div class="options" id="optionsContainer"></div>
                    <div class="explanation ${isAnswered ? 'show' : ''}" id="explanation"></div>
                </div>
            `;

            const optionsContainer = document.getElementById('optionsContainer');
            question.options.forEach((option, i) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.textContent = option;

                if (isAnswered) {
                    if (i === question.correctAnswer) {
                        optionDiv. classList.add('correct');
                    } else if (i === selectedAnswers[index]) {
                        optionDiv.classList.add('incorrect');
                    }
                } else if (i === selectedAnswers[index]) {
                    optionDiv.classList.add('selected');
                }

                optionDiv.onclick = () => selectOption(index, i, optionDiv);
                optionsContainer. appendChild(optionDiv);
            });

            if (isAnswered) {
                const explanationDiv = document.getElementById('explanation');
                explanationDiv.innerHTML = `
                    <div class="explanation-title">Explanation:</div>
                    <div class="explanation-text">${question.explanation}</div>
                `;
                explanationDiv.classList.add('show');
            }

            slideCounter.textContent = `Question ${index + 1} of ${questions.length}`;
            progressFill.style.width = ((index + 1) / questions.length * 100) + '%';
            currentSlide = index;
        }

        function selectOption(questionIndex, optionIndex, optionDiv) {
            const question = questions[questionIndex];
            const isFirstTime = !(questionIndex in selectedAnswers);

            selectedAnswers[questionIndex] = optionIndex;

            // Update all option divs
            document.querySelectorAll('.option').forEach((opt, i) => {
                opt.classList.remove('selected', 'correct', 'incorrect');
                if (i === question.correctAnswer) {
                    opt.classList.add('correct');
                } else if (i === optionIndex && optionIndex !== question.correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            // Show explanation
            const explanationDiv = document.getElementById('explanation');
            explanationDiv. innerHTML = `
                <div class="explanation-title">Explanation:</div>
                <div class="explanation-text">${question.explanation}</div>
            `;
            explanationDiv.classList.add('show');

            if (isFirstTime) {
                answeredQuestions++;
            }
        }

        function nextSlide() {
            if (currentSlide < questions.length - 1) {
                renderSlide(currentSlide + 1);
                updateNavigation();
            } else if (currentSlide === questions.length - 1) {
                renderSlide(questions.length);
                updateNavigation();
            }
        }

        function previousSlide() {
            if (currentSlide > 0) {
                renderSlide(currentSlide - 1);
                updateNavigation();
            }
        }

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document. getElementById('nextBtn');
            const navigationInfo = document.getElementById('navigationInfo');

            prevBtn.disabled = currentSlide === 0;
            nextBtn. disabled = currentSlide === questions. length && answeredQuestions === questions.length;

            if (currentSlide === questions.length) {
                navigationInfo.textContent = 'Quiz Completed';
                nextBtn.textContent = 'Finish';
            } else {
                navigationInfo.textContent = `${answeredQuestions}/${questions.length} answered`;
                nextBtn.textContent = currentSlide === questions.length - 1 ? 'Submit' : 'Next →';
            }
        }

        function calculateScore() {
            let correctCount = 0;
            for (let i = 0; i < questions.length; i++) {
                if (selectedAnswers[i] === questions[i].correctAnswer) {
                    correctCount++;
                }
            }

            const percentage = (correctCount / questions.length * 100).toFixed(1);
            document.getElementById('finalScore').textContent = `${correctCount}/${questions.length} (${percentage}%)`;

            let message = '';
            if (percentage >= 80) {
                message = 'Excellent! You have mastered the topic of Electrons! ';
            } else if (percentage >= 60) {
                message = 'Good effort! Review the explanations to strengthen your understanding.';
            } else if (percentage >= 40) {
                message = 'Fair performance. Please review the concepts and try again.';
            } else {
                message = 'Keep practicing! Go through the material and attempt the quiz again.';
            }
            document.getElementById('performanceMessage').textContent = message;
        }

        // Initialize on page load
        window.addEventListener('load', initPresentation);
    </script>
