<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page not found | PHYSICS DECODED</title>
  <script>
    (function () {
      const prefix = '/search/label/';
      const path = window.location.pathname;

      if (path.startsWith(prefix)) {
        const label = decodeURIComponent(path.slice(prefix.length))
          .replace(/\/+$/, '')
          .replace(/-/g, ' ')
          .trim();

        window.location.replace('/search.html?q=' + encodeURIComponent(label));
      }
    }());
  </script>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p><a href="/index.html">Return to PHYSICS DECODED</a></p>
  </main>
</body>
</html>
